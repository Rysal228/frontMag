<main class="content">
  <router-outlet />
</main>

<nav class="navigation" aria-label="Основная навигация">
  <div class="navigation-carousel">
    <button
      tuiIconButton
      appearance="flat"
      type="button"
      iconStart="@tui.chevron-left"
      aria-label="Предыдущие разделы"
      [disabled]="navigationPageIndex() === 0"
      (click)="previousNavigationPage()"
    ></button>

    <div class="carousel">
      <div class="carousel-track" [style.transform]="'translateX(-' + navigationPageIndex() * 100 + '%)'">
        @for (page of navigationPages(); track $index) {
          <div
            class="navigation-page"
            [style.grid-template-columns]="'repeat(' + page.length + ', minmax(0, 1fr))'"
          >
            @for (item of page; track item.route) {
              <a
                tuiButton
                appearance="flat"
                type="button"
                [routerLink]="item.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                [iconStart]="item.icon"
              >
                {{ item.label }}
              </a>
            }
          </div>
        }
      </div>
    </div>

    <button
      tuiIconButton
      appearance="flat"
      type="button"
      iconStart="@tui.chevron-right"
      aria-label="Следующие разделы"
      [disabled]="navigationPageIndex() === navigationPages().length - 1"
      (click)="nextNavigationPage()"
    ></button>
  </div>
</nav>
