<main class="content">
  <router-outlet />
</main>

<nav class="navigation" aria-label="Основная навигация">
  <div class="navigation-carousel">
    <button
      tuiIconButton
      appearance="flat"
      type="button"
      iconStart="@tui.chevron-left"
      aria-label="Предыдущие разделы"
      (click)="carousel.prev()"
    >
      Предыдущие разделы
    </button>

    <tui-carousel #carousel class="carousel">
      <ng-template *tuiItem="let index">
        <div class="navigation-page">
          @for (item of navigationPages()[index]; track item.route) {
            <a
              tuiButton
              appearance="flat"
              type="button"
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              [iconStart]="item.icon"
            >
              {{ item.label }}
            </a>
          }
        </div>
      </ng-template>
    </tui-carousel>

    <button
      tuiIconButton
      appearance="flat"
      type="button"
      iconStart="@tui.chevron-right"
      aria-label="Следующие разделы"
      (click)="carousel.next()"
    >
      Следующие разделы
    </button>
  </div>
</nav>
