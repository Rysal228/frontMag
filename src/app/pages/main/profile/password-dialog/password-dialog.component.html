<div class="backdrop" (click)="close()"></div>

<section class="modal" role="dialog" aria-modal="true" aria-labelledby="password-dialog-title" tuiFocusTrap>
  <header class="header">
    <h2 id="password-dialog-title">{{ hasPassword() ? 'Изменение пароля' : 'Создание пароля' }}</h2>
    <button
      tuiButton
      tuiAutoFocus
      appearance="flat"
      size="s"
      type="button"
      [iconStart]="'@tui.x'"
      aria-label="Закрыть"
      (click)="close()"
    ></button>
  </header>

  @if (isLoading()) {
    <p class="message content">Получаем состояние пароля...</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="content">
        @if (hasPassword()) {
          <app-form-field label="Текущий пароль">
            <app-text-field
              formControlName="currentPassword"
              type="password"
              autocomplete="current-password"
              placeholder="Введите текущий пароль"
            />
          </app-form-field>
        }

        <app-form-field label="Новый пароль">
          <app-text-field
            formControlName="newPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Введите новый пароль"
          />
        </app-form-field>

        <app-form-field label="Повторите пароль">
          <app-text-field
            formControlName="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Повторите новый пароль"
          />
        </app-form-field>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
      </div>

      <footer class="footer">
        <button tuiButton appearance="secondary" size="m" type="button" [disabled]="isSaving()" (click)="close()">
          Отмена
        </button>
        <button tuiButton appearance="primary" size="m" type="submit" [disabled]="isSaving()">
          {{ isSaving() ? 'Сохранение...' : 'Сохранить' }}
        </button>
      </footer>
    </form>
  }
</section>
