<div class="dialog">
  <h2>{{ hasPassword() ? 'Изменение пароля' : 'Создание пароля' }}</h2>

  @if (isLoading()) {
    <p class="message">Получаем состояние пароля...</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()">
      @if (hasPassword()) {
        <app-form-field label="Текущий пароль">
          <app-text-field
            formControlName="currentPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Введите текущий пароль"
          />
        </app-form-field>
      }

      <app-form-field label="Новый пароль">
        <app-text-field
          formControlName="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Введите новый пароль"
        />
      </app-form-field>

      <app-form-field label="Повторите пароль">
        <app-text-field
          formControlName="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Повторите новый пароль"
        />
      </app-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="actions">
        <button tuiButton appearance="flat" type="button" [disabled]="isSaving()" (click)="close()">
          Отмена
        </button>

        <button tuiButton type="submit" [disabled]="isSaving()">
          {{ isSaving() ? 'Сохранение...' : 'Сохранить' }}
        </button>
      </div>
    </form>
  }
</div>
