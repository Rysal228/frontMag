<section class="settings" aria-labelledby="profile-settings-heading">
  <header class="settings-heading">
    <span class="eyebrow">УПРАВЛЕНИЕ АККАУНТОМ</span>
    <h2 id="profile-settings-heading">Настройки</h2>
    <p>Безопасность и персонализация</p>
  </header>

  <div class="settings-list">
    <div class="setting-row">
      <div class="setting-description">
        <strong>Пароль</strong>
        <span>Настройки безопасности</span>
      </div>
      <button tuiButton appearance="outline" size="s" type="button" (click)="changePassword()">Изменить</button>
    </div>

    @if (canChangeRole()) {
      <div class="setting-row">
        <div class="setting-description">
          <strong>Активная роль</strong>
          <span>Переключить рабочий режим</span>
        </div>
        <button tuiButton appearance="outline" size="s" type="button" (click)="changeRole()">Сменить</button>
      </div>
    }

    <div class="setting-row setting-row_theme">
      <div class="setting-description">
        <strong>Оформление</strong>
        <span>Настройте цветовую тему</span>
      </div>
      <app-theme-toggle />
    </div>

    <div class="setting-row">
      <div class="setting-description">
        <strong>Выход из аккаунта</strong>
        <span>Завершить текущий сеанс</span>
      </div>
      <button tuiButton appearance="outline" size="s" type="button" (click)="logout()">Выйти</button>
    </div>
  </div>
</section>
