<section class="order-history">
  <header class="header">
    <h2>История заказов</h2>
  </header>

  @if (isLoading()) {
    <div class="state">
      <p>Загрузка истории...</p>
    </div>
  } @else if (hasError()) {
    <div class="state state_error">
      <p>Не удалось загрузить историю заказов.</p>
      <button tuiButton appearance="outline" type="button" (click)="reload()">Повторить</button>
    </div>
  } @else if (!orders().length) {
    <div class="empty">
      <p>У этого автомобиля пока нет заказов.</p>
    </div>
  } @else {
    <div class="list">
      @for (order of orders(); track order.id) {
        <app-order-card [order]="order" />
      }
    </div>

    @if (totalPages() > 1) {
      <tui-pagination
        [length]="totalPages()"
        [index]="currentPage() - 1"
        (indexChange)="onPageChange($event)"
      />
    }
  }
</section>
