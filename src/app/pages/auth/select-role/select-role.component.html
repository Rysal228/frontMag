<div class="container screen">
  <div class="card">
    <h1 class="title">Войти как:</h1>

    <div class="options">
      <button
        *ngFor="let definition of roles()"
        tuiButton
        type="button"
        class="role-btn"
        [iconStart]="definition.icon"
        (click)="selectRole(definition)"
      >
        {{ definition.label }}
      </button>
    </div>
  </div>
</div>
