<form class="form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="heading">
    <h1 class="title">Авторизация</h1>

    <p class="subtitle">Войдите в аккаунт удобным способом.</p>
  </div>

  <div class="fields">
    <app-form-field label="Номер телефона" controlName="phone">
      <app-text-field formControlName="phone" type="tel" autocomplete="tel" />
    </app-form-field>

    <div class="method">
      <span class="method-title"> Способ входа </span>

      <div class="methods">
        <button
          tuiButton
          type="button"
          size="m"
          [appearance]="loginMethod() === 'password' ? 'primary' : 'flat'"
          (click)="setLoginMethod('password')"
        >
          По паролю
        </button>

        <button
          tuiButton
          type="button"
          size="m"
          [appearance]="loginMethod() === 'code' ? 'primary' : 'flat'"
          (click)="setLoginMethod('code')"
        >
          По коду
        </button>
      </div>
    </div>

    @if (loginMethod() === 'password') {
      <app-form-field label="Пароль" controlName="password">
        <app-password-field formControlName="password" autocomplete="current-password" />
      </app-form-field>
    }

    @if (loginMethod() === 'code') {
      <app-form-field label="Код из MAX" controlName="code">
        <app-text-field formControlName="code" type="text" inputmode="numeric" autocomplete="one-time-code" />
      </app-form-field>

      <p class="hint">Код будет отправлен через MAX.</p>
    }
  </div>

  @if (errorMessage(); as error) {
    <p class="error">
      {{ error }}
    </p>
  }

  <button tuiButton type="submit" size="l" [disabled]="isLoading()">Войти</button>
</form>
