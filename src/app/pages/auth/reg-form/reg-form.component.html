<form class="form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="heading">
    <h1 class="title">Регистрация</h1>

    <p class="subtitle">Создайте аккаунт для продолжения.</p>
  </div>

  <div class="fields">
    <tui-textfield>
      <label tuiLabel> Номер телефона </label>

      <input formControlName="phone" tuiInput type="tel" autocomplete="tel" />
    </tui-textfield>

    <tui-error formControlName="phone" />

    <tui-textfield>
      <label tuiLabel> Пароль </label>

      <input formControlName="password" tuiInput type="password" autocomplete="new-password" />
    </tui-textfield>

    <tui-error formControlName="password" />

    <tui-textfield>
      <label tuiLabel> ФИО </label>

      <input formControlName="fullName" tuiInput autocomplete="name" />
    </tui-textfield>

    <tui-error formControlName="fullName" />

    <tui-textfield>
      <label tuiLabel> Дата рождения </label>

      <input formControlName="birthday" tuiInput type="date" />
    </tui-textfield>
  </div>

  @if (errorMessage(); as error) {
    <p class="error">
      {{ error }}
    </p>
  }

  <button tuiButton type="submit" size="l" [disabled]="isLoading()">Зарегистрироваться</button>
</form>
