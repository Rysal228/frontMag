<div class="fields">
  <app-form-field label="Номер телефона" controlName="phone">
    <app-text-field formControlName="phone" type="tel" autocomplete="tel" />
  </app-form-field>

  <app-form-field label="Пароль" controlName="password">
    <app-password-field formControlName="password" autocomplete="new-password" />
  </app-form-field>

  <app-form-field label="ФИО" controlName="fullName">
    <app-text-field formControlName="fullName" autocomplete="name" />
  </app-form-field>

  <app-form-field label="Дата рождения" controlName="birthday">
    <app-date-field formControlName="birthday" />
  </app-form-field>
</div>
