<form class="form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="heading">
    <h1 class="title">Регистрация</h1>
  </div>

  <div class="fields">
    <div class="field field--full">
      <app-form-field label="Номер телефона" controlName="phone">
        <app-text-field
          formControlName="phone"
          type="tel"
          placeholder="+7 (___) ___-__-__"
          [maskitoOptions]="phoneMaskitoOptions"
        />
      </app-form-field>
    </div>

    <div class="field field--full">
      <app-form-field label="Пароль" controlName="password">
        <app-text-field
          formControlName="password"
          type="password"
          placeholder="Введите пароль"
          autocomplete="new-password"
        />
      </app-form-field>
    </div>

    <div class="field field--half">
      <app-form-field label="Фамилия">
        <app-text-field formControlName="lastName" placeholder="Введите фамилию" />
      </app-form-field>
    </div>

    <div class="field field--half">
      <app-form-field label="Имя">
        <app-text-field formControlName="firstName" placeholder="Введите имя" />
      </app-form-field>
    </div>

    <div class="field field--half">
      <app-form-field label="Отчество">
        <app-text-field formControlName="patronymic" placeholder="Введите отчество" />
      </app-form-field>
    </div>

    <div class="field field--half">
      <app-form-field label="Дата рождения">
        <app-date-field formControlName="birthday" />
      </app-form-field>
    </div>
  </div>

  @if (errorMessage(); as error) {
    <p class="error">
      {{ error }}
    </p>
  }

  <button tuiButton type="submit" size="l" [disabled]="isLoading()">Зарегистрироваться</button>
</form>
