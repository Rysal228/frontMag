<form class="form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="heading">
    <h1 class="title">Регистрация</h1>

    <p class="subtitle">Создайте аккаунт для продолжения.</p>
  </div>

  <div class="fields">
    <app-form-field label="Номер телефона">
      <app-text-field formControlName="phone" type="tel" [maskitoOptions]="phoneMaskitoOptions" />
    </app-form-field>

    <app-form-field label="Пароль">
      <app-password-field formControlName="password" />
    </app-form-field>

    <app-form-field label="Фамилия">
      <app-text-field formControlName="lastName" />
    </app-form-field>

    <app-form-field label="Имя">
      <app-text-field formControlName="firstName" />
    </app-form-field>

    <app-form-field label="Отчество">
      <app-text-field formControlName="patronymic" />
    </app-form-field>

    <app-form-field label="Дата рождения">
      <app-date-field formControlName="birthday" />
    </app-form-field>
  </div>

  @if (errorMessage(); as error) {
    <p class="error">
      {{ error }}
    </p>
  }

  <button tuiButton type="submit" size="l" [disabled]="isLoading()">Зарегистрироваться</button>
</form>
