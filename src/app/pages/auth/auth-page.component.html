<main class="container screen">
  <div class="grid auth-grid">
    <div class="auth-content">
      @if (mode() === 'login') {
        <app-auth-form />
      } @else {
        <app-reg-form />
      }

      <button tuiButton appearance="flat" type="button" (click)="toggleMode()">
        {{ mode() === 'login' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти' }}
      </button>
    </div>
  </div>
</main>
