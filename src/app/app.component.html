<tui-root>
  @switch (initialization.state()) {
    @case ('initializing') {
      <div class="app-state">Загрузка приложения...</div>
    }

    @case ('authentication-required') {
      <router-outlet />
    }

    @case ('authenticated') {
      <router-outlet />
    }

    @case ('error') {
      <div class="app-state">Не удалось выполнить инициализацию приложения.</div>
    }
  }

  <ng-container ngProjectAs="tuiOverContent">
    <!-- Content over app content -->
  </ng-container>

  <ng-container ngProjectAs="tuiOverDialogs">
    <!-- Content over dialogs -->
  </ng-container>

  <ng-container ngProjectAs="tuiOverAlerts">
    <!-- Content over alerts -->
  </ng-container>

  <ng-container ngProjectAs="tuiOverDropdowns">
    <!-- Content over dropdowns -->
  </ng-container>

  <ng-container ngProjectAs="tuiOverHints">
    <!-- Content over hints -->
  </ng-container>
</tui-root>
