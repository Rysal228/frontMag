<tui-textfield
  tuiChevron
  class="select"
  [tuiTextfieldCleaner]="false"
>
  <input
    tuiSelect
    [formControl]="selectControl"
    [placeholder]="placeholder()"
    [stringify]="stringify"
    (blur)="onTouched()"
  />

  <tui-data-list-wrapper *tuiTextfieldDropdown new [items]="optionValues()" />
</tui-textfield>
