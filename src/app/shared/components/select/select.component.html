<tui-textfield
  tuiChevron
  class="select"
  [stringify]="stringify"
  [tuiTextfieldCleaner]="false"
>
  <input tuiSelect [formControl]="selectControl" [placeholder]="placeholder()" (blur)="onTouched()" />

  <tui-data-list-wrapper *tuiTextfieldDropdown [items]="optionValues()" />
</tui-textfield>
