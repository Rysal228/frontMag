<tui-textfield tuiChevron class="select">
  <input [placeholder]="placeholder()" tuiSelect (blur)="onTouched()" [formControl]="selectControl" />

  <cdk-virtual-scroll-viewport *tuiTextfieldDropdown tuiScrollable class="scroll" [itemSize]="100">
    <tui-data-list>
      <button *cdkVirtualFor="let item of optionValues()" new tuiOption type="button" [value]="item">
        {{ item }}
      </button>
    </tui-data-list>
  </cdk-virtual-scroll-viewport>
</tui-textfield>
