<tui-textfield
  tuiChevron
  class="select"
  [stringify]="stringify"
  [tuiTextfieldCleaner]="false"
  [tuiDropdown]="dropdown"
>
  <input tuiSelect [formControl]="selectControl" [placeholder]="placeholder()" (blur)="onTouched()" />
</tui-textfield>

<ng-template #dropdown>
  <tui-data-list-wrapper [items]="optionValues()" />
</ng-template>
