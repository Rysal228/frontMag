<div class="filters">
  @if (hasSearch()) {
    <app-form-field label="Поиск" class="search">
      <app-text-field
        placeholder="VIN, гос. номер, заказ, телефон..."
        [ngModel]="filters().search"
        (ngModelChange)="onSearch($event)"
      />
    </app-form-field>
  }

  <div class="actions">
    <tui-badged-content>
      @if (activeFilterCount()) {
        <tui-badge-notification size="s" tuiSlot="top">
          {{ activeFilterCount() }}
        </tui-badge-notification>
      }

      <button
        tuiButton
        appearance="outline"
        size="m"
        type="button"
        [iconStart]="'@tui.list-filter'"
        (click)="openModal()"
      >
        Фильтры
      </button>
    </tui-badged-content>

    @if (activeFilterCount() || filters().search) {
      <button tuiButton appearance="secondary" size="m" type="button" (click)="resetAll()">Сбросить всё</button>
    }
  </div>
</div>

@if (isModalOpen()) {
  <app-order-filters-modal
    [permissions]="permissions()"
    [context]="context()"
    [filters]="filters()"
    [brands]="brands()"
    [models]="models()"
    [workTypes]="workTypes()"
    [statuses]="statuses()"
    [workStatuses]="workStatuses()"
    (filtersChange)="onModalFiltersChange($event)"
    (closed)="closeModal()"
  />
}
