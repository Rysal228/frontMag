@if (compactExpandable()) {
  <section tuiCardLarge="compact" class="order-card order-card_expandable">
    <header class="card-header">
      <h3>Заказ № {{ order().orderNumber }}</h3>

      <span
        class="status status-badge"
        [attr.data-appearance]="order().status.appearance"
        [attr.data-status-code]="order().status.code"
      >
        {{ order().status.name }}
      </span>

      <div class="card-actions">
        <button
          tuiButton
          appearance="flat"
          size="s"
          type="button"
          class="icon-button"
          [iconStart]="expanded() ? '@tui.chevron-up' : '@tui.chevron-down'"
          [attr.aria-expanded]="expanded()"
          [attr.aria-label]="expanded() ? 'Свернуть заказ' : 'Раскрыть заказ'"
          (click)="toggleExpanded()"
        ></button>

        <a
          tuiButton
          appearance="flat"
          size="s"
          type="button"
          class="icon-button"
          [routerLink]="['/appointments', order().id]"
          iconStart="@tui.arrow-up-right"
          aria-label="Открыть подробности заказа"
          title="Открыть подробности заказа"
        ></a>
      </div>
    </header>

    <tui-expand [expanded]="expanded()">
      <app-order-card-details [order]="order()" [showCarInfo]="showCarInfo()" />
    </tui-expand>
  </section>
} @else {
  <a class="order-card" [routerLink]="['/appointments', order().id]">
    <header class="card-header">
      <h3>Заказ № {{ order().orderNumber }}</h3>
      <span
        class="status status-badge"
        [attr.data-appearance]="order().status.appearance"
        [attr.data-status-code]="order().status.code"
      >
        {{ order().status.name }}
      </span>
    </header>

    <app-order-card-details [order]="order()" [showCarInfo]="showCarInfo()" />

  </a>
}
