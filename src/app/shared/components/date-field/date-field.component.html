<tui-textfield>
  <!-- <label tuiLabel>Выберите дату</label> -->

  <input
    tuiInputDate
    [disabled]="disabled"
    [min]="minDate()"
    [max]="maxDate()"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    placeholder="Выберите дату"
  />

  <tui-calendar *tuiTextfieldDropdown />
</tui-textfield>
