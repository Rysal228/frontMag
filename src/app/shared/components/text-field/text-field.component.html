<tui-textfield class="text-field">
  <input
    tuiTextfield
    [maskito]="maskitoOptions()"
    [type]="type()"
    [value]="value"
    [disabled]="disabled"
    [autocomplete]="autocomplete()"
    [placeholder]="placeholder()"
    [attr.inputmode]="inputmode()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  @if (type() === 'password') {
    <tui-icon tuiPassword />
  }
</tui-textfield>
