name: Frontend CI/CD

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t service-car-frontend:ci .

  deploy:
    name: Deploy to production
    needs: build
    runs-on: [self-hosted, Linux, X64, production]
    steps:
      - name: Update production repository
        run: |
          cd /opt/service-car/frontend
          git pull --ff-only origin dev

      - name: Rebuild frontend container
        run: |
          cd /opt/service-car
          docker compose up -d --build frontend
